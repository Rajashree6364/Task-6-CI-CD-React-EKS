apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-cicd-app
  labels:
    app: react-cicd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-cicd-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: react-cicd-app
    spec:
      containers:
        - name: react-cicd-app
          image: rajashreem14/react-cicd-app:IMAGE_TAG
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
